  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', Helvetica, sans-serif;
      background: #0F1A24;
      color: #F5F8FA;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    :root {
      --bg: #0F1A24;
      --navy: #314657;
      --accent: #3B82F6;
      --orange: #F97316;
      --text: #F5F8FA;
      --muted: rgba(245, 248, 250, 0.65);
      --subtle: rgba(245, 248, 250, 0.45);
      --border: rgba(255, 255, 255, 0.1);
      --max: 1080px;
    }

    .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 20px; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15, 26, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 0.85rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text);
    }
    .lang-toggle {
      display: flex; gap: 6px; font-size: 0.78rem; font-weight: 600;
    }
    .lang-toggle button {
      background: none; border: none; cursor: pointer;
      color: var(--subtle); font-family: inherit; padding: 4px 6px;
      transition: color 0.15s;
    }
    .lang-toggle button.active { color: var(--accent); }
    .lang-toggle span { color: var(--border); }

    /* Hero */
    .hero { padding: 32px 0 48px; }
    .hero-grid {
      display: flex; flex-direction: column; gap: 32px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Geist', 'Space Grotesk', sans-serif;
      font-size: clamp(1.85rem, 5.5vw, 2.65rem);
      font-weight: 700; line-height: 1.15;
      letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .hero h1 em { font-style: normal; color: var(--accent); }
    .hero-sub {
      font-size: 1.05rem; line-height: 1.7;
      color: var(--muted); margin-bottom: 14px;
    }
    .hero-value {
      font-size: 0.92rem; line-height: 1.65;
      color: var(--subtle); margin-bottom: 24px;
    }
    .cta-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .cta-group.equal { flex-direction: row; flex-wrap: wrap; }
    .cta-group.equal .store-btn { flex: 1; min-width: 140px; }
    .store-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 20px; border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
      border: 1.5px solid transparent; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .store-btn.primary {
      background: var(--accent); color: #0F1A24;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
    }
    .store-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(59, 130, 246, 0.45); }
    .store-btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.14);
      color: var(--text);
    }
    .store-btn.secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .store-btn svg { flex-shrink: 0; width: 20px; height: 20px; }
    .cta-fine {
      font-size: 0.8rem; color: var(--subtle); line-height: 1.5;
    }

    /* Phone frame */
    .phone-wrap {
      display: flex; justify-content: center;
      max-width: 280px; margin: 0 auto;
    }
    .phone {
      width: 100%; background: #1c1c1e; border-radius: 36px;
      padding: 10px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5),
        0 0 0 1.5px #3a3a3c;
    }
    .phone-screen {
      border-radius: 28px; overflow: hidden;
      background: #000; aspect-ratio: 9/19.5;
    }
    .phone-screen img {
      width: 100%; height: 100%; object-fit: cover; object-position: top;
    }

    /* Sections */
    section { padding: 48px 0; }
    .section-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 12px; text-align: center;
    }
    .section-title {
      font-family: 'Geist', 'Space Grotesk', sans-serif;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700; text-align: center;
      line-height: 1.3; max-width: 640px; margin: 0 auto;
    }

    /* Pain cards */
    .pain-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
    .pain-card {
      background: rgba(49, 70, 87, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 20px;
    }
    .pain-icon { font-size: 1.5rem; margin-bottom: 10px; line-height: 1; }
    .pain-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;
    }
    .pain-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.65; }

    /* Solution */
    .solution { padding: 40px 0; background: rgba(59, 130, 246, 0.06); }
    .solution .section-title { color: var(--text); }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 20px; margin-top: 28px; }
    .step {
      display: flex; gap: 16px; align-items: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px;
    }
    .step-num {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 10px; background: var(--orange);
      color: #0F1A24; font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
    }
    .step h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 6px;
    }
    .step p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }

    /* Pricing anchor */
    .pricing-anchor { text-align: center; }
    .pricing-anchor p {
      font-size: 1rem; color: var(--muted); margin-bottom: 8px; line-height: 1.6;
    }
    .pricing-anchor .highlight {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 700; color: var(--text); margin: 12px 0;
    }
    .pricing-anchor .fine { font-size: 0.88rem; color: var(--subtle); }

    /* Onboarding box */
    .onboard-box {
      max-width: 560px; margin: 0 auto;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(59, 130, 246, 0.04));
      border: 1px solid rgba(59, 130, 246, 0.28);
      border-radius: 16px; padding: 28px 24px; text-align: center;
    }
    .onboard-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: #10b981; margin-bottom: 10px;
    }
    .onboard-box h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem; font-weight: 700; margin-bottom: 10px;
    }
    .onboard-box p {
      font-size: 0.9rem; color: var(--muted); line-height: 1.7;
      margin-bottom: 20px;
    }
    .btn-call {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 28px; background: var(--accent); color: #0F1A24;
      border-radius: 9px; font-weight: 700; font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-call:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    /* Final CTA */
    .final-cta {
      background: var(--navy);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center; padding: 56px 0;
    }
    .final-cta h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      font-weight: 700; line-height: 1.25;
      max-width: 520px; margin: 0 auto 12px;
    }
    .final-cta .sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 24px; }
    .final-cta .cta-group { max-width: 480px; margin: 0 auto; }

    /* Footer */
    footer {
      padding: 28px 0 36px; text-align: center;
      font-size: 0.78rem; color: var(--subtle); line-height: 1.8;
    }
    footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    footer a:hover { color: var(--text); }

    /* Scroll reveal */
    [data-reveal] {
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    [data-reveal].visible { opacity: 1; transform: translateY(0); }

    @media (min-width: 768px) {
      .hero { padding: 48px 0 8px; }
      .hero-grid {
        flex-direction: row; align-items: center;
        gap: 48px;
      }
      .hero-copy { flex: 1; min-width: 0; }
      .phone-wrap { flex: 0 0 280px; margin: 0; }
      .pain-grid { flex-direction: row; }
      .pain-card { flex: 1; }
      .steps { flex-direction: row; }
      .step { flex: 1; flex-direction: column; }
      #hero-cta,
      #final-cta {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-reveal] { opacity: 1; transform: none; transition: none; }
      .store-btn, .btn-call { transition: none; }
    }

    /* Desktop QR block — hidden on mobile */
    .qr-block {
      display: none;
    }
    @media (min-width: 768px) {
      .qr-block {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        margin-top: 24px;
        padding: 0;
        background: none;
        border: none;
        border-radius: 0;
      }
      .qr-img-wrap {
        flex-shrink: 0;
        width: 116px;
        height: 116px;
        background: #ffffff;
        border-radius: 10px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .qr-img {
        width: 100px;
        height: 100px;
        display: block;
      }
      .qr-text {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .qr-block .qr-label {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        color: #F5F8FA;
        line-height: 1.3;
      }
      .qr-block .qr-sub {
        font-size: 0.8rem;
        color: rgba(245, 248, 250, 0.5);
        line-height: 1.5;
      }
      .qr-block .qr-badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .qr-block .qr-badge-pill {
        font-size: 0.7rem;
        font-weight: 600;
        color: rgba(245, 248, 250, 0.5);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 3px 10px;
      }
    }
  </style>
</head>

        onboardHeadline: 'Appel de configuration gratuit de 30 minutes avec notre équipe',

        finalHeadline: 'Sache ce que chaque chantier te coûte. Avant que le projet soit terminé.',
        finalSub: 'Essai gratuit de 14 jours. Sans carte de crédit. Appel d\'accompagnement inclus.',

    };

    var APPLE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>';
    var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.18 23.76c.3.17.64.22.99.14l13.24-7.46-2.76-2.77-11.47 10.09zM.48 1.16C.18 1.48 0 1.96 0 2.59v18.82c0 .63.18 1.11.48 1.43l.08.07 10.54-10.54v-.25L.56 1.09l-.08.07zM20.55 10.3l-2.84-1.6-3.1 3.1 3.1 3.1 2.87-1.62c.82-.46.82-1.22-.03-1.98zM3.18.24l13.24 7.46-2.76 2.76L2.19.37c-.3-.17.65-.2.99-.13z"/></svg>';

    var lang = 'en';
    var platform = 'desktop';
    var utm = {};
    var scrollMarks = { 25: false, 50: false, 75: false, 100: false };

    function detectPlatform() {
      var ua = navigator.userAgent || '';
      if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'desktop';
    }

    function detectLang() {
      var stored = localStorage.getItem('nx-lang');
      if (stored === 'fr' || stored === 'en') return stored;
      var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (nav.indexOf('fr') === 0) return 'fr';
      return 'en';
    }

    function readUtms() {
      var params = new URLSearchParams(window.location.search);
      var data = {};
      UTM_KEYS.forEach(function (key) {
        var val = params.get(key);
        if (val) {
          data[key] = val;
          try { sessionStorage.setItem('nx_' + key, val); } catch (e) {}
        } else {
          try {
            var stored = sessionStorage.getItem('nx_' + key);
            if (stored) data[key] = stored;
          } catch (e) {}
        }
      });
      return data;
    }

    function withUtms(url) {
      var u = new URL(url);
      Object.keys(utm).forEach(function (key) {
        if (utm[key]) u.searchParams.set(key, utm[key]);
      });
      return u.toString();
    }

    function t(key) {
      return COPY[lang][key] || COPY.en[key] || '';
    }

    function applyCopy() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (COPY[lang][key]) el.textContent = COPY[lang][key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-html');
        if (COPY[lang][key]) el.innerHTML = COPY[lang][key];
      });
      document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-alt');
        if (COPY[lang][key]) el.alt = COPY[lang][key];
      });
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
      renderCtas(document.getElementById('hero-cta'));
      renderCtas(document.getElementById('final-cta'));
      // QR block copy
      var qrLabel = document.getElementById('qr-label');
      var qrSub = document.getElementById('qr-sub');
      var qrBadge1 = document.getElementById('qr-badge1');
      var qrBadge2 = document.getElementById('qr-badge2');
      if (lang === 'fr') {
        if (qrLabel) qrLabel.textContent = 'Scannez pour télécharger sur votre téléphone';
        if (qrSub) qrSub.textContent = 'Pointez votre caméra sur le code. Ouvre l\'App Store ou Google Play automatiquement.';
        if (qrBadge1) qrBadge1.textContent = 'Sans carte de crédit';
        if (qrBadge2) qrBadge2.textContent = 'Appel d\'accompagnement inclus';
      } else {
        if (qrLabel) qrLabel.textContent = 'Scan to download on your phone';
        if (qrSub) qrSub.textContent = 'Point your phone camera at the code. Opens App Store or Google Play automatically.';
        if (qrBadge1) qrBadge1.textContent = 'No credit card required';
        if (qrBadge2) qrBadge2.textContent = 'Free onboarding call included';
      }
    }

    function makeStoreBtn(store, position, variant) {
      var isIos = store === 'ios';
      var a = document.createElement('a');
      a.className = 'store-btn ' + variant;
      a.href = withUtms(isIos ? APP_STORE : PLAY_STORE);
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = (isIos ? APPLE_SVG : PLAY_SVG) + '<span>' + (isIos ? t('iosCta') : t('androidCta')) + '</span>';
      a.addEventListener('click', function () {
        if (window.posthog) {
          posthog.capture('trial_cta_clicked', {
            platform: isIos ? 'ios' : 'android',
            position: position,
            lang: lang
          });
        }
      });
      return a;
    }

    function renderCtas(container) {
      if (!container) return;
      container.innerHTML = '';
      container.classList.remove('equal');
      if (platform === 'ios') {
        container.appendChild(makeStoreBtn('ios', 'primary', 'primary'));
        container.appendChild(makeStoreBtn('android', 'secondary', 'secondary'));
      } else if (platform === 'android') {
        container.appendChild(makeStoreBtn('android', 'primary', 'primary'));
        container.appendChild(makeStoreBtn('ios', 'secondary', 'secondary'));
      } else {
        container.classList.add('equal');
        container.appendChild(makeStoreBtn('ios', 'primary', 'primary'));
        container.appendChild(makeStoreBtn('android', 'primary', 'primary'));
      }
    }

    function initReveal() {
      if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('[data-reveal]').forEach(function (el) { el.classList.add('visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -24px 0px' });
      document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
    }

    function initScrollDepth() {
      function check() {
        var doc = document.documentElement;
        var scrollTop = window.scrollY || doc.scrollTop;
        var height = doc.scrollHeight - doc.clientHeight;
        if (height <= 0) return;
        var pct = Math.round((scrollTop / height) * 100);
        [25, 50, 75, 100].forEach(function (mark) {
          if (!scrollMarks[mark] && pct >= mark) {
            scrollMarks[mark] = true;
            if (window.posthog) {
              posthog.capture('trial_scroll_depth', { depth: mark, lang: lang });
            }
          }
        });
      }
      window.addEventListener('scroll', check, { passive: true });
      check();
    }

    document.getElementById('lang-en').addEventListener('click', function () {
      lang = 'en';
      localStorage.setItem('nx-lang', 'en');
      applyCopy();
    });
    document.getElementById('lang-fr').addEventListener('click', function () {
      lang = 'fr';
      localStorage.setItem('nx-lang', 'fr');
      applyCopy();
    });

    document.getElementById('call-cta').addEventListener('click', function () {
      if (window.posthog) {
        posthog.capture('trial_call_cta_clicked', { lang: lang });
      }
    });

    platform = detectPlatform();
    lang = detectLang();
    utm = readUtms();
    applyCopy();
    initReveal();
    initScrollDepth();

    if (window.posthog) {
      posthog.capture('trial_page_viewed', {
        utm_source: utm.utm_source || null,
        utm_campaign: utm.utm_campaign || null,
        utm_medium: utm.utm_medium || null,
        platform: platform,
        lang: lang
      });
    }
  })();
  </script>
