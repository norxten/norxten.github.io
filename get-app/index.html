<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Norxten Core — iOS & Android</title>
  <meta name="description" content="Download Norxten Core — field cost control for general contractors. Free on iOS and Android.">
  <link rel="canonical" href="https://norxten.com/get-app" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', Helvetica, sans-serif;
      background: #0D1B2A;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      max-width: 200px;
      height: auto;
      margin: 0 auto 32px auto;
      display: block;
    }
    .eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #3B82F6;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.15s ease;
      margin-bottom: 12px;
    }
    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-ios {
      background: #ffffff;
      color: #0D1B2A;
    }
    .btn-android {
      background: #314657;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 28px auto;
    }
    .both-stores {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.65); }
    .status-msg {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      margin-top: 8px;
      min-height: 18px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Norxten Core" class="logo">

    <p class="eyebrow">Available Now</p>
    <h1 id="headline">Get Norxten Core</h1>
    <p class="subtitle" id="subtitle">Field cost control for general contractors.<br>Track crew, receipts, and job costs — from the field.</p>

    <div class="both-stores" id="btn-group">
      <!-- Populated by JS -->
    </div>

    <p class="status-msg" id="status-msg"></p>

    <a href="https://norxten.com" class="back-link">← norxten.com</a>
  </div>

  <script>
    const IOS_STORE = 'https://apps.apple.com/us/app/norxten-core/id6763566449';
    const ANDROID_STORE = 'https://play.google.com/store/apps/details?id=com.norxten.core';

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(navigator.userAgent);

    const btnGroup = document.getElementById('btn-group');
    const headline = document.getElementById('headline');
    const subtitle = document.getElementById('subtitle');
    const statusMsg = document.getElementById('status-msg');

    const iosBtn = `
      <a href="${IOS_STORE}" class="btn btn-ios" id="ios-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Download on the App Store
      </a>`;

    const androidBtn = `
      <a href="${ANDROID_STORE}" class="btn btn-android" id="android-btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4483.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4483.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.2439 13.8533 7.8508 12 7.8508s-3.5902.3931-5.1367 1.0989L4.841 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3435-4.1021-2.6892-7.5743-6.1185-9.4396"/>
        </svg>
        Get it on Google Play
      </a>`;

    if (isIOS) {
      headline.textContent = 'Download for iPhone';
      subtitle.textContent = 'Norxten Core is available free on the App Store.';
      btnGroup.innerHTML = iosBtn;
      // Auto-redirect on mobile
      window.location.href = IOS_STORE;
    } else if (isAndroid) {
      headline.textContent = 'Download for Android';
      subtitle.textContent = 'Norxten Core is available free on Google Play.';
      btnGroup.innerHTML = androidBtn;
      // Auto-redirect on mobile
      window.location.href = ANDROID_STORE;
    } else {
      // Desktop — show both buttons
      btnGroup.innerHTML = iosBtn + androidBtn;
      statusMsg.textContent = 'Open this link on your phone to be taken directly to your app store.';
    }
  </script>
</body>
</html>
