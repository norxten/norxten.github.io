<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe — Norxten</title>
  <meta name="description" content="Manage your Norxten Core email preferences.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://norxten.com/unsubscribe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', Helvetica, sans-serif;
      background: #f7f9fb;
      color: #0F1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15, 17, 23, 0.06);
      padding: 40px 32px 32px;
      text-align: center;
    }

    .logo {
      max-width: 160px;
      height: auto;
      margin: 0 auto 32px;
      display: block;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #e5e7eb;
      border-top-color: #2D9CDB;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: #314657;
      margin-bottom: 12px;
    }

    .message {
      font-size: 0.95rem;
      color: #6B7280;
      line-height: 1.65;
    }

    .message a {
      color: #2D9CDB;
      text-decoration: none;
    }

    .message a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 0.85rem;
      color: #6B7280;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #314657;
    }

    .state-error h1 {
      color: #0F1117;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px 28px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/norxten-core-icon-light.png" alt="Norxten Core" class="logo" style="max-width: 72px; height: auto; margin: 0 auto 28px; display: block;">
    <div id="state" aria-live="polite"></div>
    <a href="https://norxten.com" class="back-link" id="back-link">← norxten.com</a>
  </div>

  <script>
    (function () {
      var MESSAGES = {
        en: {
          processing: 'Processing your unsubscribe request...',
          successHeading: "You've been unsubscribed.",
          successBody: 'You will no longer receive product update emails from Norxten Core. If you unsubscribed by mistake, you can re-enable emails from the app settings.',
          errorHeading: 'Something went wrong.',
          errorBody: 'We could not process your unsubscribe request. Please try again or contact <a href="mailto:support@norxten.com">support@norxten.com</a>.',
          backLink: '← norxten.com'
        },
        fr: {
          processing: 'Traitement de votre demande de désabonnement...',
          successHeading: 'Vous êtes désabonné.',
          successBody: "Vous ne recevrez plus d'e-mails de mise à jour de Norxten Core. Si vous vous êtes désabonné par erreur, vous pouvez réactiver les e-mails depuis les paramètres de l'application.",
          errorHeading: "Une erreur s'est produite.",
          errorBody: 'Nous n\'avons pas pu traiter votre demande. Veuillez réessayer ou contacter <a href="mailto:support@norxten.com">support@norxten.com</a>.',
          backLink: '← norxten.com'
        }
      };

      var API_URL = 'https://udocbvdjhsoebdgdsxvi.supabase.co/functions/v1/marketing_unsubscribe';

      function detectLang() {
        var stored = localStorage.getItem('nx-lang');
        if (stored) return stored;
        var browser = navigator.language || 'en';
        return browser.toLowerCase().startsWith('fr') ? 'fr' : 'en';
      }

      var lang = detectLang();
      if (lang !== 'fr') lang = 'en';
      document.documentElement.lang = lang;

      var t = MESSAGES[lang];
      var stateEl = document.getElementById('state');
      var backLink = document.getElementById('back-link');
      backLink.textContent = t.backLink;

      function showProcessing() {
        stateEl.className = '';
        stateEl.innerHTML =
          '<div class="spinner" aria-hidden="true"></div>' +
          '<p class="message">' + t.processing + '</p>';
      }

      function showSuccess() {
        stateEl.className = '';
        stateEl.innerHTML =
          '<h1>' + t.successHeading + '</h1>' +
          '<p class="message">' + t.successBody + '</p>';
      }

      function showError() {
        stateEl.className = 'state-error';
        stateEl.innerHTML =
          '<h1>' + t.errorHeading + '</h1>' +
          '<p class="message">' + t.errorBody + '</p>';
      }

      function getToken() {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (token === null) return null;
        token = token.trim();
        return token.length > 0 ? token : null;
      }

      function unsubscribe(token) {
        showProcessing();

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        })
          .then(function (res) {
            if (!res.ok) {
              showError();
              return null;
            }
            return res.json();
          })
          .then(function (data) {
            if (data === null) return;
            if (data && data.status === 'ok') {
              showSuccess();
            } else {
              showError();
            }
          })
          .catch(function () {
            showError();
          });
      }

      var token = getToken();
      if (!token) {
        showError();
      } else {
        unsubscribe(token);
      }
    })();
  </script>
</body>
</html>
